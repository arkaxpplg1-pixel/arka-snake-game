<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#050814">

    <title>ARKA SNAKE GAME</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- ==========================================
         AUDIO
    =========================================== -->

    <!-- Musik utama -->
    <audio
        id="mainBackground"
        src="background/main_background.mp4"
        loop
        preload="auto">
    </audio>

    <!-- Suara makan makanan -->
    <audio
        id="coinSound"
        src="background/coin_sound.mp4"
        preload="auto">
    </audio>

    <!-- Suara Game Over -->
    <audio
        id="gameOverSound"
        src="background/game_over.mp4"
        preload="auto">
    </audio>


    <!-- ==========================================
         MUSIC BUTTON
    =========================================== -->

    <button id="musicButton" type="button">
        🔊 MUSIC ON
    </button>


    <!-- ==========================================
         SPLASH SCREEN
    =========================================== -->

    <div id="splashScreen">

        <div class="scan-line"></div>

        <div class="splash-content">

            <div class="snake-logo">

                <div class="logo-head">

                    <span class="logo-eye left"></span>
                    <span class="logo-eye right"></span>

                </div>

                <div class="logo-body body-1"></div>
                <div class="logo-body body-2"></div>
                <div class="logo-body body-3"></div>

            </div>


            <h1>
                ARKA SNAKE GAME
            </h1>


            <p class="subtitle">
                M I N I &nbsp; S N A K E &nbsp; G A M E
            </p>


            <div class="loading-box">

                <div class="loading-bar">

                    <div id="loadingProgress"></div>

                </div>


                <div class="loading-info">

                    <span id="loadingText">
                        INITIALIZING...
                    </span>

                    <span id="loadingPercent">
                        0%
                    </span>

                </div>

            </div>


            <p class="skip-text">
                PRESS SPACE TO SKIP
            </p>

        </div>

    </div>



    <!-- ==========================================
         GAME
    =========================================== -->

    <div id="gameContainer">


        <!-- TOP BAR -->

        <div class="top-bar">

            <div class="game-title">
                ARKA <span>SNAKE</span>
            </div>


            <div class="score-box">
                SCORE :
                <span id="score">0</span>
            </div>


            <div class="speed-box">
                SPEED :
                <span id="speed">5</span>
            </div>

        </div>



        <!-- GAME AREA -->

        <div id="gameArea">

            <canvas id="gameCanvas"></canvas>


            <div id="notification"></div>


            <!-- GAME OVER -->

            <div id="gameOver">

                <div class="game-over-box">

                    <div class="game-over-title">
                        GAME OVER
                    </div>


                    <div class="final-score">

                        SCORE :
                        <span id="finalScore">0</span>

                    </div>


                    <div class="restart-text">
                        PRESS SPACE OR TAP RESTART
                    </div>


                    <button id="restartButton">
                        RESTART GAME
                    </button>

                </div>

            </div>

        </div>



        <!-- ==========================================
             JOYSTICK HP
        =========================================== -->

        <div id="joystickArea">

            <div id="joystick">

                <div id="joystickStick">
                    ●
                </div>

            </div>

        </div>


        <!-- CONTROL INFO DESKTOP -->

        <div class="control-info">

            <span>↑ ↓ ← →</span>

            <span>OR</span>

            <span>W A S D</span>

            <span>•</span>

            <span>SWIPE / TOUCH</span>

        </div>


    </div>



    <script src="script.js"></script>

</body>

</html>
